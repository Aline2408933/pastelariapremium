<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastelaria Premium</title>

<style>
:root {
    --verde:#20c997;
    --verde2:#159d7a;
    --amarelo:#ffc107;
}

body {margin:0;font-family:Arial;background:#f5fffb;}

header {
    background: var(--verde);
    color:#fff;
    text-align:center;
    padding:20px;
}

.container {
    max-width:600px;
    margin:auto;
    padding:15px;
    padding-bottom:170px;
}

.box {
    background:#fff;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.box input {
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

/* ABAS */
#abas {display:flex;overflow-x:auto;gap:5px;margin-bottom:10px;}
.aba {padding:10px;background:#e0f7f1;border-radius:20px;cursor:pointer;font-size:13px;}
.aba.ativa {background:var(--verde);color:#fff;}

/* ITENS */
.item {background:#fff;margin-top:8px;padding:10px;border-radius:8px;}
.preco {color:var(--verde2);}

.ctrl {display:flex;align-items:center;margin-top:6px;}
.ctrl button {background:var(--amarelo);border:none;padding:5px 10px;}
.ctrl input {width:40px;text-align:center;}

/* IMAGEM */
.img-prod {width:70px;height:70px;border-radius:8px;cursor:pointer;}

/* CARRINHO */
#carrinho {
position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
background:#fff;width:90%;max-width:400px;border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);padding:10px;display:none;
}

/* FOOTER */
.footer {position:fixed;bottom:0;width:100%;background:#fff;padding:10px;}
.footer button {
background:#25d366;color:#fff;border:none;padding:15px;width:100%;border-radius:30px;
}

.extra-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.extra-ctrl {
    display:flex;
    align-items:center;
    gap:5px;
}

.extra-ctrl button {
    background: var(--amarelo);
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

.qtd-extra {
    min-width:20px;
    text-align:center;
}

/* MODAL */
#modal {
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
align-items:center;justify-content:center;
}

.modal-box {
background:#fff;
width:90%;
max-width:400px;
border-radius:10px;
padding:15px;

max-height:80vh;
overflow-y:auto;
}

/* ZOOM */
#zoomImg {
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
justify-content:center;align-items:center;
}
</style>
</head>

<body>

<header>
<h2>PASTELARIA PREMIUM</h2>
</header>

<div class="container">

<div class="box">
<input id="nome" placeholder="Seu nome">
<input id="tel" placeholder="Telefone">
<input id="endereco" placeholder="Endereço de entrega">
</div>

<div id="abas"></div>
<div id="lista"></div>

</div>

<div id="carrinho">
<b>🛒 Seu pedido</b>
<div id="listaCarrinho"></div>
<div id="totalCarrinho"></div>
</div>

<div class="footer">
<button onclick="enviar()">FINALIZAR PEDIDO</button>
</div>

<div id="modal">
<div class="modal-box">
<div style="display:flex;align-items:center;gap:10px;">
<button onclick="fecharModal()" style="background:none;border:none;font-size:18px;cursor:pointer;">⬅️</button>
<h3 id="modalTitulo"></h3>
</div>
<div id="modalExtras"></div>
<div id="modalSabores"></div>
<textarea id="modalObs" placeholder="Observação" style="width:100%;margin-top:10px;"></textarea>
<br><br>
<div style="position:sticky;bottom:0;background:#fff;padding-top:10px;">
    <button onclick="confirmarItem()" style="width:100%;">Adicionar</button>
</div>
</div>
</div>

<div id="zoomImg">
<img id="imgGrande" style="max-width:90%;max-height:90%;">
</div>

<script>

/* CARDÁPIO ORIGINAL (NÃO ALTERADO) */
const cardapio = {
"Pastéis Tradicionais":[["Carne",14, "carne.png"],["Carne com mussarela",14,"carnecommussarela.png"],["Carne com catupiry",14, "carnecomcatupiry.png"],["Carne com guariroba",16,"carnecomguariroba.png"],["Carne com milho e mussarela",15, "carnecommilhoemussarela.png"],["Carne com bacon e mussarela",17, "carnecombaconemussarela.png"],["Carne com cheddar",15, "carnecomcheddar.png"],["Carne com azeitona, tomate e cebola",17, "carnecomazeitonatomateecebola.png"],["Carne com queijo minas",16, "carneequeijominas.png"],["Carne com palmito e catupiry",17, "carnepalmitoecatupiry.png"],["Carne com mussarela e banana",17, "carnemussarelaebanana.png"],["Carne com guariroba e mussarela",18, "carneguarirobaemussarela.png"],["Carne com provolone",17, "carneeprovolone.png"],["Carne seca com banana e mussarela",20, "carnesecabananaemussarela.png"],["Carne seca com cream cheese",20, "carnesecacomcreamcheese.png"],["Carne seca com catupiry",20, "carnesecacomcatupiry.png"],["Frango",14, "frango.png"],["Frango com mussarela",14, "frangocommussarela.png"],["Frango com catupiry",14, "frangocomcatupiry.png"],["Frango com milho e mussarela",15,"frangocommilhoemussarela.png"],["Frango com guariroba",16,"frangocomguariroba.png"],["Frango com bacon e provolone",20, "frangocombaconeprovolone.png"],["Frango com bacon e catupiry",17, "frangocombaconecatupiry.png"],["Frango com queijo minas",16, "frangocomqueijominas.png"],["Frango com palmito e catupiry",17, "frangocompalmitoecatupiry.png"],["Frango com cheddar e bacon",16, "frangocomcheddarebacon.png"],["Frango com guariroba e mussarela",18, "frangocomguarirobaemussarela.png"],["Mussarela",15, "mussarela.png"],["Presunto com mussarela",14, "presuntoemussarela.png"],["Mussarela com calabresa",16],["Mussarela com bacon",18, "mussarelaebacon.png"],["Mussarela com palmito",18, "mussarelaepalmito.png"],["Queijo minas com catupiry",16, "queijominasecatupiry.png"]],
"Pastéis Especiais":[["3 Queijos(Mussarela, cream cheese e queijo minas)",17,"tresqueijos.png"],["4 Queijos (Mussarela, cream cheese, provolone e cheddar)",19,"quatroqueijos.png"],["Pizza 1(Presunto, mussarela, tomate, calabresa e orégano)",16, "pizzaum.png"],["Pizza 2(Presunto, mussarela, tomate, calabresa frango e orégano)",18, "pizzadois.png"],["Pizza 3(Presunto, mussarela, tomate, calabresa, ovo, bacon e orégano)",20, "pizzatres.png"],["Pizza 4(Presunto, mussarela, tomate, carne seca e orégano)",22, "pizzaquatro.png"],["Pastel Goiano(Frango, milho, guariroba e creme de pequi)",20, "goiano.png"],["Pastel Cachorrão(Salsicha, milho, mussarela, mostarda, ketchup, bacon e batata palha)",20, "cachorrão.png"],["Pastel Premium(Frango, carne,presunto, mussarela, tomate, milho, azeitona,cream cheese e bacon)",28, "premium.png"]],
"Pastéis Doces":[["Sabor do Paraíso (Banana, mussarela e canela)",10, "sabordoparaiso.png"],["Romeu e Julieta(Goiabada com mussarela)",10, "romeuejulieta.png"],["Doce Encantado(Doce de Leite com mussarela)",12, "doceencantado.png"],["Nutella com Banana",15, "sonhodenutellacombanana.png"],["Nutella com morango",15, "sonhodenutellacommorango.png"]],
"Batatas":[["Batata simples 400g (Bacon e Cheddar)",25,"batatasimples.png"],["Batata premium 400g (Carne seca e Cream cheese)",30, "batataespecial.png"]],
"Crepe Francês":[["Mussarela, Catupiry e Cheddar",20],["Presunto,Mussarela, Tomete, Calabresa e Orégano",22],["Presunto,Mussarela, Tomete, Calabresa, Ovo, Bacon e Orégano",25],["Frango, Milho, Bacon, Palmito, Catupiry e Mussarela",25],["Frango, Cheddar, Bacon, Azeitona e Mussarela",25],["Carne bovina moída, Milho, Bacon, Tomate, Catupiry e Mussarela ",25],["Carne seca, Banana, Tomate e Mussarela",30],["Carne secca, Tomate e Cream cheese",30],["Costela bovina, Barbecue e Mussarela",30]],
"Bebidas":[["Água Mineral",4],["Água com gás",5],["Refrigerante lata",7],["Refrigerante 600mL",10],["Refrigerante 1L",12],["Refrigerante 1,5L",13],["Suco 400ml",12],["Suco 500ml",15],["Suco 1L",18]]
};

/* ADICIONAIS (COMPLETO) */
const adicionaisPasteis=[["Mussarela",3],["Azeitona",2],["Bacon",3],["Calabresa",2],["Milho",2],["Palmito",3],["Pequi",4],["Guariroba",3],["Cheddar",2],["Ovo",2],["Tomate",2],["Uva passas",3],["Provolone",4],["Catupiry",2],["Cebola",2],["Cream cheese",4]];
const adicionaisCrepes=[["Tomate",2],["Alface",2],["Provolone",5],["Calabresa",3],["Palmito",5],["Cebola",3]];

let categoriaAtual="Pastéis Tradicionais";
let carrinhoItens=[];
let extrasSelecionados = {};
let itemAtual;

/* ABAS */
function renderAbas(){
abas.innerHTML=Object.keys(cardapio).map(cat=>`<div class="aba ${cat===categoriaAtual?'ativa':''}" onclick="trocar('${cat}')">${cat}</div>`).join('');
}
function trocar(cat){categoriaAtual=cat;renderAbas();renderLista();}

/* LISTA */
function renderLista(){
lista.innerHTML=cardapio[categoriaAtual].map(p=>`
<div class="item">
<div style="display:flex;gap:10px;">
<img src="${p[2] ? './IMG/' + p[2] : 'https://via.placeholder.com/80'}" class="img-prod">
<div><b>${p[0]}</b><br><span class="preco">R$ ${p[1]}</span></div>
</div>
<div class="ctrl">
<button onclick="abrirModal(this)">+</button>
</div>
</div>`).join('');
}

/* MODAL */
function abrirModal(btn){
let item=btn.closest(".item");
let nome=item.querySelector("b").innerText;

modal.style.display="flex";
modalTitulo.innerText=nome;
modalExtras.innerHTML="";
modalSabores.innerHTML="";

extrasSelecionados = {};

/* PASTÉIS */
if(categoriaAtual.includes("Pastéis")){
modalExtras.innerHTML = "<b>Adicionais:</b><br>" + adicionaisPasteis.map(a => `
<div class="extra-item">
<span>${a[0]} (+R$ ${a[1]})</span>
<div class="extra-ctrl">
<button onclick="alterarExtra(this,-1)" data-nome="${a[0]}" data-preco="${a[1]}">➖</button>
<span class="qtd-extra">0</span>
<button onclick="alterarExtra(this,1)" data-nome="${a[0]}" data-preco="${a[1]}">➕</button>
</div>
</div>
`).join('');
}

/* CREPES */
if(categoriaAtual==="Crepe Francês"){
modalExtras.innerHTML = "<b>Adicionais:</b><br>" + adicionaisCrepes.map(a => `
<div class="extra-item">
<span>${a[0]} (+R$ ${a[1]})</span>
<div class="extra-ctrl">
<button onclick="alterarExtra(this,-1)" data-nome="${a[0]}" data-preco="${a[1]}">➖</button>
<span class="qtd-extra">0</span>
<button onclick="alterarExtra(this,1)" data-nome="${a[0]}" data-preco="${a[1]}">➕</button>
</div>
</div>
`).join('');
}

/* SUCO */
if(nome.toLowerCase().includes("suco")){
modalSabores.innerHTML=`<b>Sabor:</b><br>
<label><input type="radio" name="sabor" value="Laranja">Laranja</label><br>
<label><input type="radio" name="sabor" value="Maracujá">Maracujá</label>`;
}

itemAtual=item;
}

function fecharModal(){
    modal.style.display = "none";
    modalObs.value = "";
}

function alterarExtra(btn, delta){
    let nome = btn.dataset.nome;
    let span = btn.parentElement.querySelector(".qtd-extra");

    if(!extrasSelecionados[nome]){
        extrasSelecionados[nome] = 0;
    }

    extrasSelecionados[nome] += delta;

    if(extrasSelecionados[nome] < 0){
        extrasSelecionados[nome] = 0;
    }

    span.innerText = extrasSelecionados[nome];
}

/* CONFIRMAR */
function confirmarItem(){
let nome=itemAtual.querySelector("b").innerText;
let preco=parseFloat(itemAtual.querySelector(".preco").innerText.replace("R$",""));

let extras=[];
let valorExtras=0;

let listaExtras = [];

if(categoriaAtual.includes("Pastéis")){
    listaExtras = adicionaisPasteis;
}

if(categoriaAtual === "Crepe Francês"){
    listaExtras = adicionaisCrepes;
}

for(let nomeExtra in extrasSelecionados){
let qtd = extrasSelecionados[nomeExtra];

if(qtd > 0){
extras.push(`${nomeExtra} x${qtd}`);

let precoExtra = listaExtras.find(a=>a[0]===nomeExtra)?.[1] || 0;
valorExtras += precoExtra * qtd;
}
}

let saborSel=document.querySelector("#modalSabores input:checked");
let sabor=saborSel?saborSel.value:"";

if(nome.toLowerCase().includes("suco") && !sabor){
alert("Escolha o sabor do suco");
return;
}

let obs=document.getElementById("modalObs").value;

carrinhoItens.push({nome,preco,extras,sabor,obs,valorExtras,qtd:1});

modal.style.display="none";
modalObs.value="";
atualizarCarrinho();
}

/* CARRINHO */
function atualizarCarrinho(){
let total=0;
let html="";

carrinhoItens.forEach((item,i)=>{
let sub=(item.preco+item.valorExtras)*item.qtd;
total+=sub;

html+=`<div>
${item.nome} x${item.qtd}<br>
${item.sabor?"🥤 "+item.sabor+"<br>":""}
${item.extras.length?"➕ "+item.extras.join(", ")+"<br>":""}
${item.obs?"📝 "+item.obs+"<br>":""}
<button onclick="removerItem(${i})">❌ Remover</button>
</div><hr>`;
});

carrinho.style.display=total>0?"block":"none";
listaCarrinho.innerHTML=html;
totalCarrinho.innerText="Total: R$ "+total.toFixed(2);
}

function removerItem(i){
carrinhoItens.splice(i,1);
atualizarCarrinho();
}

/* ZOOM */
document.addEventListener("click",e=>{
if(e.target.classList.contains("img-prod")){
zoomImg.style.display="flex";
imgGrande.src=e.target.src;
}
if(e.target.id==="zoomImg"){
zoomImg.style.display="none";
}
});

/* ENVIAR */
function enviar(){
let nome=document.getElementById("nome").value;
let tel=document.getElementById("tel").value;
let end=document.getElementById("endereco").value;

let msg=`*PEDIDO*%0A👤 ${nome}%0A📞 ${tel}%0A📍 ${end}%0A%0A`;

carrinhoItens.forEach(i=>{
msg+=`• ${i.nome} x${i.qtd}%0A`;
if(i.sabor) msg+=`   Sabor: ${i.sabor}%0A`;
if(i.extras.length) msg+=`   Extras: ${i.extras.join(", ")}%0A`;
if(i.obs) msg+=`   Obs: ${i.obs}%0A`;
});

window.open(`https://wa.me/556291484278?text=${msg}`);
}

renderAbas();
renderLista();

</script>

</body>
</html>
